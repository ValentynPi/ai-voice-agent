# Change `app` if ai-voice-agent is already taken on Fly.io.
app = "ai-voice-agent-valmax"
primary_region = "cdg"

[build]

[env]
  PORT = "3000"
  NODE_ENV = "production"
  SERVICE = "agents"
  TELEPHONY_PUBLIC_URL = "https://ai-voice-agent-telephony.fly.dev"
  PUBLIC_URL = "https://ai-voice-agent-valmax.fly.dev"
  AGENTS_PUBLIC_URL = "https://ai-voice-agent-valmax.fly.dev"
  OPENAI_MODEL = "gpt-5.1"
  OPENAI_REALTIME_MODEL = "gpt-realtime-2.1"
  OPENAI_VOICE = "marin"
  # Persist agents / knowledge / call history / MCP links on the Fly volume.
  DATABASE_PATH = "/data/maison-sol.sqlite"

# Durable SQLite for Agents app state across restarts and deploys.
# Create once: fly volumes create agents_data --region cdg --size 1 -a ai-voice-agent-valmax
# Use a single machine (SQLite is not multi-writer): fly scale count 1 -a ai-voice-agent-valmax
[mounts]
  source = "agents_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
